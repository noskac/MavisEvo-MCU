[platformio]
; Ubah 'default_envs' ke board yang sedang kamu colok ke laptop saat ini
; Pilih salah satu: esp32dev atau teensy41
default_envs = esp32dev

; ----------------------------------------------------
; ENVIRONMENT 1: ESP32
; ----------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
build_flags = 
    -D BOARD_ESP32  ; Flag penanda untuk C++

; ----------------------------------------------------
; ENVIRONMENT 2: TEENSY 4.1
; ----------------------------------------------------
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = 
    -D BOARD_TEENSY ; Flag penanda untuk C++